name: Build release archives
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run assets
      - run: git diff --exit-code -- assets/pet
      - run: npm run check
      - run: node scripts/ci-check.js
      - run: npm run release:prepare -- --sea
      - uses: actions/upload-artifact@v4
        with:
          name: codex-rpc-${{ matrix.os }}
          path: dist/release/
          if-no-files-found: error
