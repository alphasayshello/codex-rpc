name: Build release archives
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run assets
      - run: git diff --exit-code -- assets/pet
      - run: npm run check
      - run: node scripts/ci-check.js
      - run: npm run release:prepare -- --sea
      - run: node scripts/verify-sea-pets.js
      - uses: actions/upload-artifact@v4
        with:
          name: codex-rpc-${{ matrix.os }}
          path: dist/release/
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          path: dist/incoming
          pattern: codex-rpc-*
      - run: node scripts/assemble-release.js dist/incoming dist/publish
      - name: Prepare draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/publish/* --draft --verify-tag --title "codex-rpc $GITHUB_REF_NAME" --notes-file "docs/RELEASE-NOTES-$GITHUB_REF_NAME.md"
